[flake8]
extend-ignore =
    # slice colons, black-compatible
    E203,
    # line break before binary operator, black-compatible
    W503,
    # The codebase is deliberately written in dense one-liners (DTO builders, canonical spec rows). Enforcing a
    # column limit here would mean reformatting hundreds of correct lines for no readability gain.
    E501
exclude = .git,__pycache__,.venv,venv
per-file-ignores =
    # QA scripts and e2e modules must load their .env before importing app modules that read the configuration.
    scripts/*.py:E402
    tests/*.py:E402
